<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wanna date me tonight?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a1119;
    --bg-glow: #4a1c2c;
    --card: #3a1826;
    --ink: #fbeee6;
    --ink-dim: #d9b8c2;
    --accent: #e8536b;
    --accent-strong: #ff7a8a;
    --candle: #ffbf6b;
    --shadow: rgba(0,0,0,0.35);
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #210f16;
      --bg-glow: #3f1a29;
      --card: #331522;
      --ink: #fbeee6;
      --ink-dim: #d9b8c2;
      --accent: #e8536b;
      --accent-strong: #ff7a8a;
      --candle: #ffbf6b;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #210f16;
    --bg-glow: #3f1a29;
    --card: #331522;
    --ink: #fbeee6;
    --ink-dim: #d9b8c2;
    --accent: #e8536b;
    --accent-strong: #ff7a8a;
    --candle: #ffbf6b;
    --shadow: rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg: #fbeadf;
    --bg-glow: #ffd9c2;
    --card: #fff6ee;
    --ink: #3a1826;
    --ink-dim: #7a4a56;
    --accent: #e8536b;
    --accent-strong: #d13d55;
    --candle: #ff9d4d;
    --shadow: rgba(60,20,20,0.15);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(circle at 50% 15%, var(--bg-glow) 0%, transparent 60%),
      var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: 28px;
    padding: 40px 28px 32px;
    box-shadow: 0 24px 60px var(--shadow);
    position: relative;
  }

  .eyebrow-flame {
    font-size: 28px;
    display: block;
    text-align: center;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 12px var(--candle));
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 6vw, 40px);
    line-height: 1.15;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .sub {
    text-align: center;
    color: var(--ink-dim);
    font-size: 15px;
    margin: 0 0 20px;
  }

  /* ---- Stage 1: the chase ---- */
  .arena {
    position: relative;
    height: min(46vh, 340px);
    min-height: 220px;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    transform: translate(-50%, -130%);
    background: var(--ink);
    color: var(--card);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 14px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
    z-index: 5;
  }
  .bubble.show { opacity: 1; }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--ink);
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 17px;
    border: none;
    border-radius: 999px;
    padding: 15px 30px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 3px solid var(--candle); outline-offset: 3px; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .btn-yes {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, calc(-50% + 34px));
    background: var(--accent);
    box-shadow: 0 10px 24px rgba(232,83,107,0.45);
    z-index: 4;
    transition: transform 0.4s ease, background 0.15s ease;
  }
  .btn-yes:hover { background: var(--accent-strong); }
  .btn-yes.centered { transform: translate(-50%, -50%); }
  .btn-yes:active { transform: translate(-50%, calc(-50% + 34px)) scale(0.96); }
  .btn-yes.centered:active { transform: translate(-50%, -50%) scale(0.96); }

  .btn-no {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, calc(-50% - 34px));
    background: transparent;
    color: var(--ink-dim);
    border: 2px solid var(--ink-dim);
    box-shadow: none;
    z-index: 3;
    transition: left 0.25s cubic-bezier(.2,.8,.3,1.2), top 0.25s cubic-bezier(.2,.8,.3,1.2), opacity 0.4s ease, transform 0.15s ease;
  }

  /* ---- Stage 2: the answer ---- */
  .stage2 { text-align: center; }
  .stage2 h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(24px, 5.5vw, 32px);
    margin: 12px 0 8px;
  }
  .stage2 p.q {
    color: var(--ink-dim);
    font-size: 17px;
    margin: 0 0 20px;
  }
  .choices {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .choices .btn {
    position: static;
    background: var(--accent);
  }
  #btnDateContinue {
    background: var(--accent);
  }
  #btnDateContinue.secondary {
    background: transparent;
    border: 2px solid var(--ink-dim);
    color: var(--ink-dim);
  }
  .btn.secondary {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
  }

  .other-input {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .other-input input[type="text"] {
    flex: 1;
    min-width: 180px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--ink-dim);
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
  }
  .other-input input[type="text"]::placeholder { color: var(--ink-dim); opacity: 0.8; }
  .other-input input[type="text"]:focus { outline: 2px solid var(--candle); }
  .other-input .btn { padding: 12px 22px; font-size: 15px; }

  .date-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  input[type="date"] {
    font-family: var(--font-body);
    font-size: 16px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 2px solid var(--ink-dim);
    background: transparent;
    color: var(--ink);
    color-scheme: dark;
  }
  :root[data-theme="light"] input[type="date"] { color-scheme: light; }
  .weekday {
    font-weight: 800;
    color: var(--accent);
    font-size: 15px;
    min-width: 46px;
    text-align: center;
  }

  .hour-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .hour-pill {
    flex: 0 0 auto;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 15px;
    border-radius: 999px;
    border: 2px solid var(--ink-dim);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .hour-pill.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hour-pill:focus-visible { outline: 3px solid var(--candle); outline-offset: 2px; }

  #btnDateContinue { margin-top: 4px; }

  .result {
    font-family: var(--font-display);
    font-size: clamp(20px, 4.6vw, 27px);
    margin-top: 6px;
    line-height: 1.4;
  }

  .restart {
    display: block;
    text-align: center;
    margin-top: 22px;
    color: var(--ink-dim);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--font-body);
  }

  .notify {
    display: block;
    margin: 20px auto 0;
    background: var(--candle);
    color: #2a1119;
  }
  .notify:disabled {
    opacity: 0.75;
    cursor: default;
  }

  .hidden { display: none; }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.35s ease; }

  @media (prefers-reduced-motion: reduce) {
    .btn-no { transition: none; }
    .btn-yes { transition: none; }
    .pop { animation: none; }
  }
</style>
</head>
<body>

<div class="card">
  <span class="eyebrow-flame">🕯️</span>

  <div id="stage1">
    <h1>Wanna date me tonight?</h1>
    <p class="sub">Choose wisely. One of these buttons has trust issues.</p>

    <div class="arena" id="arena">
      <div class="bubble" id="bubble"></div>
      <button class="btn btn-no" id="btnNo" type="button">No</button>
      <button class="btn btn-yes" id="btnYes" type="button">Yes</button>
    </div>
  </div>

  <div id="stage2" class="stage2 hidden">
    <h2>I knew you would say yes 😁</h2>

    <div id="locStep">
      <p class="q">Then dinner, cinema, or Buc's Park?</p>
      <div class="choices">
        <button class="btn secondary" id="btnDinner" type="button">Dinner 🍝</button>
        <button class="btn secondary" id="btnCinema" type="button">Cinema 🎬</button>
        <button class="btn secondary" id="btnPark" type="button">Buc's Park 🌳</button>
      </div>
    </div>

    <div id="dinnerSubStep" class="hidden">
      <p class="q">Pizza, sushi, or something else?</p>
      <div class="choices">
        <button class="btn secondary" id="btnPizza" type="button">Pizza 🍕</button>
        <button class="btn secondary" id="btnSushi" type="button">Sushi 🍣</button>
        <button class="btn secondary" id="btnOther" type="button">Other</button>
      </div>
      <div class="other-input hidden" id="otherInputWrap">
        <input type="text" id="otherInput" placeholder="Tell me what you're craving..." maxlength="60">
        <button class="btn" id="btnOtherContinue" type="button">Continue</button>
      </div>
    </div>

    <div id="dateStep" class="hidden">
      <p class="q">When?</p>
      <div class="date-row">
        <input type="date" id="dateInput" aria-label="Date">
        <span class="weekday" id="weekdayTag"></span>
      </div>
      <div class="hour-row" id="hourRow"></div>
      <button class="btn secondary" id="btnDateContinue" type="button" disabled>Continue</button>
    </div>

    <div id="finalStep" class="hidden">
      <div class="result hidden" id="result"></div>
      <button class="btn notify hidden" id="btnNotify" type="button">💌 Notify Baptiste</button>
    </div>

    <button class="restart hidden" id="restart" type="button">Start over</button>
  </div>
</div>

<script>
(function () {
  const arena = document.getElementById('arena');
  const btnNo = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');
  const bubble = document.getElementById('bubble');
  const stage1 = document.getElementById('stage1');
  const stage2 = document.getElementById('stage2');

  const locStep = document.getElementById('locStep');
  const btnDinner = document.getElementById('btnDinner');
  const btnCinema = document.getElementById('btnCinema');
  const btnPark = document.getElementById('btnPark');

  const dinnerSubStep = document.getElementById('dinnerSubStep');
  const btnPizza = document.getElementById('btnPizza');
  const btnSushi = document.getElementById('btnSushi');
  const btnOther = document.getElementById('btnOther');
  const otherInputWrap = document.getElementById('otherInputWrap');
  const otherInput = document.getElementById('otherInput');
  const btnOtherContinue = document.getElementById('btnOtherContinue');

  const dateStep = document.getElementById('dateStep');
  const dateInput = document.getElementById('dateInput');
  const weekdayTag = document.getElementById('weekdayTag');
  const hourRow = document.getElementById('hourRow');
  const btnDateContinue = document.getElementById('btnDateContinue');

  const finalStep = document.getElementById('finalStep');
  const result = document.getElementById('result');
  const btnNotify = document.getElementById('btnNotify');
  const restart = document.getElementById('restart');

  // --- Google Form target: fill these in once you have your form's pre-filled link ---
  // 1. In Google Forms: ⋮ menu → "Obtenir un lien prérempli", fill test values, click "Obtenir le lien".
  // 2. That URL looks like: https://docs.google.com/forms/d/e/XXXXX/viewform?usp=pp_url&entry.111=A&entry.222=B...
  //    - GOOGLE_FORM_ACTION is the same URL but ending in /formResponse instead of /viewform
  //    - each ENTRY_* below is the "entry.xxxxxxx" name that held the matching test value
  const GOOGLE_FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLSd3GBTQP_yygJ1e7VCPuzkqcZ6VWld9Xi-Ok3FaCkhzT0M1Xw/formResponse';
  const ENTRY_CLICKS = 'entry.559352220';
  const ENTRY_LOCATION = 'entry.924523986';
  const ENTRY_DATE = 'entry.877086558';   // Date-type question, expects YYYY-MM-DD
  const ENTRY_TIME = 'entry.1852097437';  // Short answer, e.g. "19:00"

  const teaseLines = ["Say yes 🥺", "Hey, don't run 😅", "I'm seriously asking you out 💕"];
  const MAX_CLICKS = 3;
  let clickCount = 0;
  let noPos = { x: 0.5, y: 0.42 }; // fraction of arena size
  let bubbleTimer = null;

  let locationDisplay = '';
  let formLocationValue = ''; // must exactly match a form option, or the '__other_option__' sentinel
  let formOtherText = '';     // only used when formLocationValue is the "Other" sentinel
  let selectedHour = null;

  // ---------- Stage 1: the chase ----------

  function getMargins() {
    const rect = arena.getBoundingClientRect();
    const btnRect = btnNo.getBoundingClientRect();
    const bubbleRect = bubble.getBoundingClientRect();
    const rawPadX = (Math.max(btnRect.width, bubbleRect.width, 90) / 2 + 10) / rect.width;
    const rawPadTop = (Math.max(btnRect.height, 44) / 2 + Math.max(bubbleRect.height, 36) + 14) / rect.height;
    const rawPadBottom = (Math.max(btnRect.height, 44) / 2 + 10) / rect.height;
    const padX = Math.min(rawPadX, 0.46);
    const padTop = Math.min(rawPadTop, 0.46);
    const padBottom = Math.min(rawPadBottom, 0.46);
    return {
      minX: padX, maxX: 1 - padX,
      minY: padTop, maxY: 1 - padBottom
    };
  }

  function clampToArena(fracX, fracY) {
    const m = getMargins();
    return {
      x: Math.max(m.minX, Math.min(m.maxX, fracX)),
      y: Math.max(m.minY, Math.min(m.maxY, fracY))
    };
  }

  function placeNoAt(fracX, fracY) {
    const rect = arena.getBoundingClientRect();
    const x = fracX * rect.width;
    const y = fracY * rect.height;
    btnNo.style.left = x + 'px';
    btnNo.style.top = y + 'px';
    btnNo.style.transform = 'translate(-50%, -50%)';
    bubble.style.left = x + 'px';
    bubble.style.top = y + 'px';
  }

  function getYesBox() {
    const rect = arena.getBoundingClientRect();
    const yesRect = btnYes.getBoundingClientRect();
    return {
      cx: (yesRect.left + yesRect.width / 2 - rect.left) / rect.width,
      cy: (yesRect.top + yesRect.height / 2 - rect.top) / rect.height,
      halfW: (yesRect.width / 2 + 16) / rect.width,
      halfH: (yesRect.height / 2 + 16) / rect.height
    };
  }

  function overlapsYes(fx, fy) {
    const rect = arena.getBoundingClientRect();
    const btnRect = btnNo.getBoundingClientRect();
    const noHalfW = (btnRect.width / 2 + 8) / rect.width;
    const noHalfH = (btnRect.height / 2 + 8) / rect.height;
    const yb = getYesBox();
    return Math.abs(fx - yb.cx) < (yb.halfW + noHalfW) && Math.abs(fy - yb.cy) < (yb.halfH + noHalfH);
  }

  function randomFarPointFrom(fromX, fromY) {
    const m = getMargins();
    let best = null, bestDist = -1;
    let fallback = null, fallbackDist = -1;
    for (let i = 0; i < 20; i++) {
      const cx = m.minX + Math.random() * (m.maxX - m.minX);
      const cy = m.minY + Math.random() * (m.maxY - m.minY);
      const d = Math.hypot(cx - fromX, cy - fromY);
      if (d > fallbackDist) { fallbackDist = d; fallback = { x: cx, y: cy }; }
      if (overlapsYes(cx, cy)) continue;
      if (d > bestDist) { bestDist = d; best = { x: cx, y: cy }; }
    }
    return best || fallback;
  }

  function teleport(text) {
    bubble.textContent = text;
    const next = randomFarPointFrom(noPos.x, noPos.y);
    noPos = next;
    placeNoAt(next.x, next.y);
    const scale = Math.max(0.7, 1 - (clickCount - 1) * 0.06);
    btnNo.style.fontSize = (17 * scale) + 'px';
    btnNo.style.padding = (15 * scale) + 'px ' + (30 * scale) + 'px';
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 1300);
  }

  function hideNoButton() {
    bubble.classList.remove('show');
    btnYes.classList.add('centered');
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      btnNo.style.opacity = '0';
      btnNo.style.pointerEvents = 'none';
      btnNo.style.visibility = 'hidden';
      return;
    }
    const rect = arena.getBoundingClientRect();
    const btnRect = btnNo.getBoundingClientRect();
    const currentLeft = parseFloat(btnNo.style.left) || rect.width / 2;
    const currentTop = parseFloat(btnNo.style.top) || rect.height / 2;
    const windupLeft = currentLeft - 26;
    const exitX = rect.width + btnRect.width;

    btnNo.style.pointerEvents = 'none';

    btnNo.style.transition = 'left 0.2s ease-out, top 0.2s ease-out, transform 0.2s ease-out';
    btnNo.style.left = windupLeft + 'px';
    btnNo.style.top = (currentTop + 5) + 'px';
    btnNo.style.transform = 'translate(-50%, -50%) rotate(8deg)';

    setTimeout(() => {
      btnNo.style.transition = 'left 1.1s cubic-bezier(.32,.6,.34,1), top 0.7s ease, transform 1.1s ease, opacity 0.45s ease 0.6s';
      btnNo.style.left = exitX + 'px';
      btnNo.style.top = Math.max(20, currentTop - 18) + 'px';
      btnNo.style.transform = 'translate(-50%, -50%) rotate(-10deg)';
      btnNo.style.opacity = '0';
    }, 200);

    setTimeout(() => { btnNo.style.visibility = 'hidden'; }, 200 + 1150);
  }

  btnNo.addEventListener('click', (e) => {
    e.preventDefault();
    if (clickCount > MAX_CLICKS) return;
    clickCount++;
    if (clickCount <= MAX_CLICKS) {
      teleport(teaseLines[clickCount - 1]);
    } else {
      hideNoButton();
    }
  });

  window.addEventListener('resize', () => {
    if (clickCount <= MAX_CLICKS) {
      const clamped = clampToArena(noPos.x, noPos.y);
      noPos = clamped;
      placeNoAt(clamped.x, clamped.y);
    }
  });

  btnYes.addEventListener('click', () => {
    stage1.classList.add('hidden');
    stage2.classList.remove('hidden');
    stage2.classList.add('pop');
  });

  // ---------- Stage 2, step 1: location ----------

  function goToDateStep() {
    locStep.classList.add('hidden');
    dinnerSubStep.classList.add('hidden');
    dateStep.classList.remove('hidden');
    dateStep.classList.add('pop');
  }

  btnDinner.addEventListener('click', () => {
    locStep.classList.add('hidden');
    dinnerSubStep.classList.remove('hidden');
    dinnerSubStep.classList.add('pop');
  });
  btnCinema.addEventListener('click', () => {
    locationDisplay = 'Cinema 🎬';
    formLocationValue = 'Cinema';
    goToDateStep();
  });
  btnPark.addEventListener('click', () => {
    locationDisplay = "Buc's Park 🌳";
    formLocationValue = 'Park of Buc';
    goToDateStep();
  });

  // ---------- Stage 2, step 1b: dinner sub-choice ----------

  btnPizza.addEventListener('click', () => {
    locationDisplay = 'Dinner — Pizza 🍕';
    formLocationValue = 'Pizzeria';
    goToDateStep();
  });
  btnSushi.addEventListener('click', () => {
    locationDisplay = 'Dinner — Sushi 🍣';
    formLocationValue = 'Sushi';
    goToDateStep();
  });
  btnOther.addEventListener('click', () => {
    otherInputWrap.classList.remove('hidden');
    otherInput.focus();
  });
  btnOtherContinue.addEventListener('click', () => {
    const val = otherInput.value.trim();
    const detail = val || 'something else';
    locationDisplay = 'Dinner — ' + detail;
    formLocationValue = '__other_option__';
    formOtherText = detail;
    goToDateStep();
  });
  otherInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); btnOtherContinue.click(); }
  });

  // ---------- Stage 2, step 2: date & time ----------

  const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  for (let h = 11; h <= 22; h++) {
    const pill = document.createElement('button');
    pill.type = 'button';
    pill.className = 'hour-pill';
    pill.textContent = String(h).padStart(2, '0') + ':00';
    pill.dataset.hour = String(h);
    pill.addEventListener('click', () => {
      hourRow.querySelectorAll('.hour-pill').forEach((p) => p.classList.remove('selected'));
      pill.classList.add('selected');
      selectedHour = h;
      updateDateContinueState();
    });
    hourRow.appendChild(pill);
  }

  function updateDateContinueState() {
    const isReady = dateInput.value && selectedHour !== null;
    btnDateContinue.disabled = !isReady;
    btnDateContinue.classList.toggle('secondary', !isReady);
  }

  dateInput.addEventListener('change', () => {
    if (dateInput.value) {
      const parts = dateInput.value.split('-').map(Number);
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      weekdayTag.textContent = WEEKDAYS[dt.getDay()];
    } else {
      weekdayTag.textContent = '';
    }
    updateDateContinueState();
  });

  btnDateContinue.addEventListener('click', () => {
    dateStep.classList.add('hidden');
    finalStep.classList.remove('hidden');
    finalStep.classList.add('pop');
    showFinal();
  });

  // ---------- Stage 2, step 3: recap + notify ----------

  function showFinal() {
    const hourStr = String(selectedHour).padStart(2, '0') + ':00';
    result.textContent =
      "It's a date — " + locationDisplay + "\n" +
      weekdayTag.textContent + " " + dateInput.value + " at " + hourStr + " ❤️";
    result.style.whiteSpace = 'pre-line';
    result.classList.remove('hidden');
    btnNotify.classList.remove('hidden');
    restart.classList.remove('hidden');

    btnNotify.onclick = () => {
      btnNotify.disabled = true;
      btnNotify.textContent = 'Sending...';
      const params = new URLSearchParams();
      params.append(ENTRY_CLICKS, String(clickCount));
      params.append(ENTRY_LOCATION, formLocationValue);
      if (formLocationValue === '__other_option__') {
        params.append(ENTRY_LOCATION + '.other_option_response', formOtherText);
      }
      params.append(ENTRY_DATE, dateInput.value);
      params.append(ENTRY_TIME, hourStr);
      params.append('fvv', '1');
      params.append('submit', 'Submit');
      fetch(GOOGLE_FORM_ACTION, { method: 'POST', mode: 'no-cors', body: params })
        .then(() => { btnNotify.textContent = "Sent! 😊"; })
        .catch(() => {
          btnNotify.textContent = 'Oops, try again';
          btnNotify.disabled = false;
        });
    };
  }

  // ---------- Restart ----------

  restart.addEventListener('click', () => {
    stage2.classList.add('hidden');
    stage1.classList.remove('hidden');

    locStep.classList.remove('hidden');
    dinnerSubStep.classList.add('hidden');
    otherInputWrap.classList.add('hidden');
    otherInput.value = '';
    dateStep.classList.add('hidden');
    finalStep.classList.add('hidden');

    result.classList.add('hidden');
    btnNotify.classList.add('hidden');
    btnNotify.disabled = false;
    btnNotify.textContent = '💌 Notify Baptiste';
    restart.classList.add('hidden');

    dateInput.value = '';
    weekdayTag.textContent = '';
    hourRow.querySelectorAll('.hour-pill').forEach((p) => p.classList.remove('selected'));
    selectedHour = null;
    btnDateContinue.disabled = true;
    btnDateContinue.classList.add('secondary');
    locationDisplay = '';
    formLocationValue = '';
    formOtherText = '';

    clickCount = 0;
    btnNo.style.fontSize = '';
    btnNo.style.padding = '';
    btnNo.style.transition = '';
    btnNo.style.opacity = '';
    btnNo.style.pointerEvents = '';
    btnNo.style.visibility = '';
    btnNo.style.transform = '';
    btnYes.classList.remove('centered');
    noPos = { x: 0.5, y: 0.42 };
    requestAnimationFrame(() => placeNoAt(noPos.x, noPos.y));
  });

  requestAnimationFrame(() => placeNoAt(noPos.x, noPos.y));
})();
</script>

</body>
</html>
